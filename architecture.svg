<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8; }
      .box-accent { fill: #161b22; stroke: #58a6ff; stroke-width: 2; rx: 8; }
      .box-green { fill: #161b22; stroke: #3fb950; stroke-width: 2; rx: 8; }
      .box-purple { fill: #161b22; stroke: #bc8cff; stroke-width: 2; rx: 8; }
      .text-title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 15px; font-weight: 700; }
      .text-body { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: 400; }
      .text-muted { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; font-family: monospace; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
      .arrow-green { stroke: #3fb950; stroke-width: 2; fill: none; marker-end: url(#arrow-green-head); }
      .badge { fill: #21262d; stroke: #30363d; rx: 4; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-green-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="12" />

  <!-- Layer 1: Android Framework -->
  <g transform="translate(40, 30)">
    <rect width="780" height="150" class="box" />
    <text x="20" y="30" class="text-title">1. Android Framework (ColorOS 17 / Android 16+)</text>
    <text x="20" y="48" class="text-muted">DisplayPowerController &amp; AutomaticBrightnessController inside system_server</text>

    <!-- Source A -->
    <rect x="20" y="65" width="230" height="65" class="badge" />
    <text x="32" y="88" class="text-body" font-weight="600">Priority 1: Property</text>
    <text x="32" y="106" class="text-muted">debug.tracing.screen_brightness</text>
    <text x="32" y="120" class="text-muted">RAM read / zero CPU overhead</text>

    <!-- Source B -->
    <rect x="275" y="65" width="230" height="65" class="badge" stroke="#3fb950" stroke-width="1.2" />
    <text x="287" y="88" class="text-body" font-weight="600" fill="#3fb950">Priority 2: Live Binder</text>
    <text x="287" y="106" class="text-muted">cmd display get-brightness 0</text>
    <text x="287" y="120" class="text-muted">Live auto-brightness float</text>

    <!-- Source C -->
    <rect x="530" y="65" width="230" height="65" class="badge" />
    <text x="542" y="88" class="text-body" font-weight="600">Priority 3: Settings Fallback</text>
    <text x="542" y="106" class="text-muted">settings get system screen_brightness</text>
    <text x="542" y="120" class="text-muted">Manual slider backup only</text>
  </g>

  <!-- Connectors from Layer 1 to 2 -->
  <path d="M 155 180 L 155 220 L 430 220 L 430 250" class="arrow" />
  <path d="M 390 180 L 390 250" class="arrow-green" />
  <path d="M 645 180 L 645 220 L 430 220" class="arrow" />

  <!-- Layer 2: xia_display_adaptor (Native Rust Daemon) -->
  <g transform="translate(40, 250)">
    <rect width="780" height="200" class="box-accent" />
    <text x="20" y="30" class="text-title">2. xia_display_adaptor (Rust Native Service)</text>
    <text x="20" y="48" class="text-muted">Runs as vendor service (vendor.xia.display.adaptor-V6@1.0-service)</text>

    <!-- Sub-module: State Filter -->
    <rect x="20" y="65" width="230" height="110" class="badge" />
    <text x="32" y="88" class="text-body" font-weight="600">Screen State Guard</text>
    <text x="32" y="108" class="text-muted">debug.tracing.screen_state</text>
    <text x="32" y="126" class="text-muted">0 / 1: Screen Off / AOD (Skip poll)</text>
    <text x="32" y="144" class="text-muted">2: Screen ON (Process input)</text>
    <text x="32" y="162" class="text-muted">3 / 4: Doze (Lux AOD handling)</text>

    <!-- Sub-module: Normalizer -->
    <rect x="275" y="65" width="230" height="110" class="badge" />
    <text x="287" y="88" class="text-body" font-weight="600">Float Normalizer</text>
    <text x="287" y="108" class="text-muted">from_framework_float()</text>
    <text x="287" y="126" class="text-muted">0.0..1.0 mapped to min..max</text>
    <text x="287" y="144" class="text-muted">&gt;1.0 treated as direct scale</text>
    <text x="287" y="162" class="text-muted">Arg index cached in AtomicI8</text>

    <!-- Sub-module: Scaler -->
    <rect x="530" y="65" width="230" height="110" class="badge" />
    <text x="542" y="88" class="text-body" font-weight="600">Hardware Scaler</text>
    <text x="542" y="108" class="text-muted">persist.sys.rianixia.brightness.mode</text>
    <text x="542" y="126" class="text-muted">Mode 0: Gamma 2.2 Curved</text>
    <text x="542" y="144" class="text-muted">Mode 1: Linear 1:1</text>
    <text x="542" y="162" class="text-muted">Mode 2: Custom 75% curve</text>
  </g>

  <!-- Connector from Layer 2 to 3 -->
  <path d="M 430 450 L 430 500" class="arrow" />

  <!-- Layer 3: Kernel / Hardware -->
  <g transform="translate(40, 500)">
    <rect width="780" height="85" class="box-green" />
    <text x="20" y="30" class="text-title" fill="#3fb950">3. Transsion Kernel Backlight Interface</text>
    <text x="20" y="52" class="text-body">Direct sysfs node: /sys/class/leds/lcd-backlight/brightness</text>
    <text x="20" y="70" class="text-muted">Direct low-level libc::write via open file descriptor. Smooth auto-brightness on real panel.</text>
  </g>
</svg>
